[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imeta"
version = "1.0.0"
description = "Deterministic, lossless image serialization system with a custom binary container format (.imeta)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Daksh Gehlot" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
]

[project.scripts]
imeta = "imeta.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["imeta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
